# Correction Handler — Implementation

Triggered by: /correct <text> in Discord #corrections

Steps:
  1. Parse correction text from command
  2. Use claude-sonnet-4-6 (Tier 2) to interpret the correction accurately:
     - What behavior is being corrected?
     - What should the new behavior be?
     - Is this a factual update, a preference, or a behavioral rule?
  3. Classify correction type: BEHAVIOR / FACT / PREFERENCE / FORMAT
  4. Format as structured correction entry:
     ## <date> — <brief title>
     **Type:** <BEHAVIOR|FACT|PREFERENCE|FORMAT>
     **Original behavior:** <what DhruvaOS did>
     **Corrected behavior:** <what it should do>
     **Rule:** <imperative statement of the new rule>
  5. Append to ~/brain/concepts/corrections.md (read first to preserve existing entries)
  6. Post acknowledgment to #corrections: "Understood. [brief summary of correction]."

Note: Uses Tier 2 (Sonnet) for cost efficiency. Corrections are textual interpretation
tasks — Sonnet handles them well. Escalate to Tier 3 only if a correction involves
complex multi-step behavioral reasoning that Sonnet demonstrably fails on.
